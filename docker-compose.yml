version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: kisanvaarta
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: kisan
      MYSQL_PASSWORD: kisan123
    networks:
      - kisan-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "kisan", "-pkisan123"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7.2-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    command: redis-server --requirepass kisanvaarta
    networks:
      - kisan-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "kisanvaarta", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-broker:
    image: apache/kafka:3.7.0
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - kisan-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kisan-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:29092
    networks:
      - kisan-network
    depends_on:
      kafka-broker:
        condition: service_healthy

  init-kafka:
    image: apache/kafka:3.7.0
    container_name: init-kafka
    volumes:
      - ./init-kafka-topics.sh:/init-kafka-topics.sh
    entrypoint: ["/bin/sh", "-c", "/init-kafka-topics.sh"]
    networks:
      - kisan-network
    depends_on:
      kafka-broker:
        condition: service_healthy

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_APPLICATION_NAME=gateway-service
      - SPRING_KAFKA_CONSUMER_GROUP_ID=gateway-service-group
    env_file:
      - docker-compose.env
    depends_on:
      mysql-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
    networks:
      - kisan-network

  price-service:
    build:
      context: ./price-service
      dockerfile: Dockerfile
    container_name: price-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_APPLICATION_NAME=price-service
      - SPRING_KAFKA_CONSUMER_GROUP_ID=price-service-group
    env_file:
      - docker-compose.env
    depends_on:
      mysql-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
    networks:
      - kisan-network

  ai-engine-service:
    build:
      context: ./ai-engine-service
      dockerfile: Dockerfile
    container_name: ai-engine-service
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - SPRING_APPLICATION_NAME=ai-engine-service
      - SPRING_KAFKA_CONSUMER_GROUP_ID=ai-engine-service-group
    env_file:
      - docker-compose.env
    depends_on:
      mysql-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
    networks:
      - kisan-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - SPRING_APPLICATION_NAME=notification-service
      - SPRING_KAFKA_CONSUMER_GROUP_ID=notification-service-group
    env_file:
      - docker-compose.env
    depends_on:
      mysql-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
    networks:
      - kisan-network

networks:
  kisan-network:
    name: kisan-network
    driver: bridge
